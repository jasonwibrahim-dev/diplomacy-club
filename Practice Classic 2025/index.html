<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-color: #ffffff;
            /* Page background color */
            padding: 40px 20px;
            /* Padding at the top, bottom, and sides */
            font-family: sans-serif;
            /* Cleans up the text font */
        }

        .container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            /* Adjust this to change the spacing between elements */
        }

        img {
            max-width: 100%;
            height: auto;
            /* Keeps the original aspect ratio */
            display: block;
        }

        p {
            font-size: 1.2rem;
            color: #000000;
            /* Text color */
            text-align: center;
            line-height: 1.5;
            max-width: 600px;
        }
    </style>
    <title>Practice Classic 2025</title>
</head>

    <p>We have added our Practice Classic game from 2025.</p>

</html>
